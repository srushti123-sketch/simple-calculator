<!DOCTYPE html>
<html>
<head><title>Simple Calculator</title></head>
<body>
  <h2>Quick Web Calculator</h2>
  <input type="number" id="n1" placeholder="Number 1">
  <input type="number" id="n2" placeholder="Number 2">
  <button onclick="document.getElementById('res').innerText = Number(n1.value) + Number(n2.value)">Add</button>
  <p>Result: <span id="res">0</span></p>
</body>
</html>
